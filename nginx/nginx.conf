events {
    worker_connections 1024;
}

http {
    upstream backend {
        server aira_backend:3000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name aira.winnerx0.dev;

        # Certbot webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name aira.winnerx0.dev;

        ssl_certificate     /etc/letsencrypt/live/aira.winnerx0.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aira.winnerx0.dev/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        resolver 127.0.0.11 valid=10s;

        location / {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
