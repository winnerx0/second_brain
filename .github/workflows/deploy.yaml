name: 'deploy'

on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to main
        uses: actions/checkout@v3
      - name: Create Google Docs MCP Token
        run: |
          mkdir -p .config/google-docs-mcp
          printf '%s' '${{ secrets.GOOGLE_DOCS_MCP_TOKEN }}' > .config/google-docs-mcp/token.json
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/second_brain:latest .
          docker push ${{ vars.DOCKERHUB_USERNAME }}/second_brain:latest
