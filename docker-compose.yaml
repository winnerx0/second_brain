services:
  backend:
    container_name: aira_backend
    build: ./backend/
    ports:
      - "3005:3005"
    env_file:
      - ./backend/.env
    environment:
      PORT: "3005"
    restart: unless-stopped
    stop_grace_period: 17m
    depends_on:
      db:
        condition: service_healthy
    # The image has no bun and no curl, so this uses the Python stdlib.
    #
    # TODO(phase-4): point this back at /workflows/health and require workers > 0.
    # That is the check that proves the embedded workflow worker is alive, which is
    # why stop_grace_period below is 17m. It cannot be used yet because the workflow
    # routes and worker are not ported, so the endpoint does not exist.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:3005/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: winnerx0
      POSTGRES_PASSWORD: 2007
      POSTGRES_DB: aira
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "winnerx0", "-d", "aira"]
      interval: 30s
      timeout: 10s
      retries: 3
