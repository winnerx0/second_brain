services:
  nginx:
    build: "./nginx/"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

  backend:
    container_name: "aira_backend"
    build: "./"
    expose:
      - "3005"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal
    # depends_on:
    #   db:
    #     condition: service_healthy

  # db:
  #   container_name: "aira_db"
  #   image: "pgvector/pgvector:0.8.2-pg18-trixie"
  #   environment:
