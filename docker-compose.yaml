services:
  backend:
    container_name: aira_backend
    build: ./backend/
    ports:
      - "3005:3005"
    env_file:
      - ./backend/.env
    environment:
      PORT: "3005"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: ./backend/
    command: ["bun", "dist/worker.js"]
    env_file:
      - ./backend/.env
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://backend:3005/workflows/health');const h=await r.json();process.exit(r.ok&&h.workers>0?0:1)"]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: winnerx0
      POSTGRES_PASSWORD: 2007
      POSTGRES_DB: aira
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "winnerx0", "-d", "aira"]
      interval: 30s
      timeout: 10s
      retries: 3
