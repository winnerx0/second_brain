services:
  backend:
    container_name: aira_backend
    build: ./backend/
    ports:
      - "3005:3005"
    env_file:
      - ./backend/.env
    environment:
      PORT: "3005"
    restart: unless-stopped
    stop_grace_period: 17m
    depends_on:
      db:
        condition: service_healthy
    # Requires a live workflow worker, not just a responding HTTP server — which is
    # why stop_grace_period is 17m, enough for a 15-minute run to drain. The image
    # has neither bun nor curl, so this uses the Python stdlib.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request; r=urllib.request.urlopen('http://localhost:3005/workflows/health', timeout=5); sys.exit(0 if json.load(r).get('workers',0) > 0 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: winnerx0
      POSTGRES_PASSWORD: 2007
      POSTGRES_DB: aira
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "winnerx0", "-d", "aira"]
      interval: 30s
      timeout: 10s
      retries: 3
